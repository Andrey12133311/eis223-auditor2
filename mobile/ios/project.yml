name: EISAuditor
options:
  bundleIdPrefix: ru.eis223
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  EISAuditor:
    type: application
    platform: iOS
    sources:
      - path: EISAuditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.eis223.auditor
        PRODUCT_NAME: EISAuditor
        INFOPLIST_FILE: EISAuditor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      build:
        targets:
          EISAuditor: all

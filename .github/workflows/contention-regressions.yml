name: Contention and archive retry regressions
on:
  push:
    branches: [fix/contention-and-archive-retry-20261020]
    paths: [.github/workflows/contention-regressions.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for isolated reproduction
        run: |
          mkdir -p /tmp/eis-source
          git archive --format=zip --output=/tmp/eis-source/source.zip HEAD app.py scripts tests requirements.txt Dockerfile .github/workflows
          git rev-parse HEAD > /tmp/eis-source/COMMIT
          sha256sum /tmp/eis-source/source.zip > /tmp/eis-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: contention-test-source
          path: /tmp/eis-source/
          retention-days: 1
          if-no-files-found: error

name: Release account reproduction
on:
  push:
    branches: [fix/release-account-contracts-20261020]
    paths: [.github/workflows/release-account-reproduction.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source, never production data or credentials
        run: |
          mkdir -p /tmp/account-source
          git archive --format=zip --output=/tmp/account-source/source.zip HEAD app.py scripts tests requirements.txt requirements-accounts.txt Dockerfile .github/workflows
          git rev-parse HEAD > /tmp/account-source/COMMIT
          sha256sum /tmp/account-source/source.zip > /tmp/account-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-account-source
          path: /tmp/account-source/
          retention-days: 1
          if-no-files-found: error

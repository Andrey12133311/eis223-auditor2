name: Account module tests
on:
  push:
    branches:
      - feature/user-accounts-approval
      - thematic-audit-20261015
  pull_request:
    paths:
      - "scripts/account_*"
      - "scripts/v373_thematic_email_notifications.py"
      - "tests/test_account_*"
      - ".github/workflows/account-tests.yml"
jobs:
  account-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated account test dependencies
        run: python -m pip install -r requirements-accounts.txt
      - name: Compile account modules
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('scripts').glob('account_*.py')]"
      - name: Compile EIS adapter
        run: python -m py_compile scripts/account_eis_adapter_v1.py
      - name: Run isolated account tests
        run: python -m unittest discover -s tests -p 'test_account_*.py' -v

name: Isolated intake repair verification
on:
  push:
    branches: ['fix/intake-sqlite-pressure-20261020']
    paths: ['.github/workflows/repair-source-snapshot.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/intake-sqlite-pressure-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staged patch and exact regression module
        run: |
          echo 'cbafabcb37f7b3bf71dc300f90a962d6f4bf391c2189c884597a67481731a697  repair-intake-core.patch' | sha256sum -c -
          echo 'ecc2dd9ccaa0ea6df6688f2277b0d05cf445b0e77306ab8fbc748509f0c73085  tests/test_intake_sqlite_pressure.py' | sha256sum -c -
          git apply --check repair-intake-core.patch
          git apply repair-intake-core.patch
          git diff --check
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-accounts.txt
      - name: Compile and run intake regressions
        run: |
          set -o pipefail
          python -m py_compile scripts/eis223_soap_xml.py scripts/v294_eis_bridge.py scripts/v298_eis_only.py scripts/v334_findings_ledger.py scripts/v357_storage_guard.py
          python -m unittest test_intake_sqlite_pressure test_eis223_soap_archive test_eis_mixed_soap_quarantine test_eis_upload_rejection_logging test_eis_server_worker test_eis_worker_backpressure test_eis_vps_pipeline test_eis_original_upload_stream test_eis_response_size 2>&1 | tee repair-intake-tests.log
      - name: Run SQLite, durability and scheduling regressions
        run: |
          set -o pipefail
          python -m unittest test_audit_persistence_lock_scope test_audit_db_retry test_thematic_persist_lock_scope test_thematic_index_lock_scope test_price_recovery_lock_scope test_reconciliation_lock_scope test_customer_metadata_lock_scope test_v381_audit_scheduling 2>&1 | tee repair-lock-tests.log
          python scripts/v334_history_selftest.py 2>&1 | tee repair-history-tests.log
      - name: Verify tested file hashes and publish repair branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          cat <<'HASHES' | sha256sum -c -
          67c9157efc34b0257913aa92864e551d43c5c7bd2f71bade9811effd4d7cfaf5  Dockerfile
          1905ee42d007c54972da54fc96db8d1ad88a17c57578c0a11b11d0a0928db1f7  scripts/eis223_soap_xml.py
          c6836b767e6be9ee377ff2fb3b167b60b8549f3f59032b3312fa31caf466930c  scripts/v294_eis_bridge.py
          b9a6495f804e9eca385c49b2b5edfa9fd3e00d7a155fa3707f88ae00f834872e  scripts/v298_eis_only.py
          e3d39a70a565683f7bf43f768748d8bd09974ee426eda0a184d7e1d5691b2e7f  scripts/v334_findings_ledger.py
          42a80e59ebe52b00d440797f3461f6457b26a8cc3fca2ce082edbef6dc1e8ca3  scripts/v357_storage_guard.py
          HASHES
          test "$(git ls-remote origin refs/heads/fix/intake-sqlite-pressure-20261020 | cut -f1)" = "$EXPECTED_HEAD"
          git add Dockerfile scripts/eis223_soap_xml.py scripts/v294_eis_bridge.py scripts/v298_eis_only.py scripts/v334_findings_ledger.py scripts/v357_storage_guard.py
          git rm -- repair-intake-core.patch repair-intake.patch.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reduce no-op SQLite writer pressure and move archive intake off HTTP loop'
          git push origin HEAD:refs/heads/fix/intake-sqlite-pressure-20261020
          git archive --format=tar.gz --output=repair-tested-source.tar.gz HEAD
          git rev-parse HEAD | tee repair-tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-repair-verification
          path: |
            repair-*-tests.log
            repair-tested-source.tar.gz
            repair-tested-commit.txt
          retention-days: 2
          if-no-files-found: warn

name: Isolated repair source snapshot
on:
  push:
    branches: ['fix/intake-sqlite-pressure-20261020']
    paths: ['.github/workflows/repair-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=repair-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-snapshot
          path: repair-source.tar.gz
          retention-days: 1
          if-no-files-found: error

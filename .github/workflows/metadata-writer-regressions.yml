name: Metadata writer regressions
on:
  pull_request:
    paths:
      - 'scripts/v314_eis_metadata.py'
      - 'scripts/v298_eis_only.py'
      - 'scripts/full_recheck_runtime.py'
      - 'tests/test_ingestion_metadata_contention.py'
      - '.github/workflows/metadata-writer-regressions.yml'
permissions:
  contents: read
jobs:
  sqlite-real-contention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
      - name: Verify no-op readers, concurrent rebases, lease fences and metadata provenance
        env:
          PYTHONPATH: '.:scripts:tests'
        run: |
          python -m unittest test_ingestion_metadata_contention test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry test_price_provenance_chain
          python -m pytest -q tests/test_v314_eis_metadata.py
          git diff --check

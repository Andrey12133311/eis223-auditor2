name: Throughput and memo regressions
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_extraction_throughput.py'
      - 'tests/test_general_original_collection_retry.py'
      - 'tests/test_automatic*.py'
      - 'tests/test_full_recheck*.py'
      - 'tests/test_intake_automatic_rechecks.py'
      - 'tests/test_semantic_audit_sources.py'
      - 'tests/test_legal_audit_revision.py'
      - 'tests/test_legal_event_coverage.py'
      - 'tests/test_legal_security_clause_coverage.py'
      - 'tests/test_bid_security_price_basis.py'
      - 'tests/test_price_provenance_chain.py'
      - 'tests/test_receipt_original_parity.py'
      - 'tests/test_stale_original_completion.py'
      - 'tests/test_archive_member_occurrences.py'
      - 'tests/test_audit_funnel.py'
      - 'tests/test_audit_rule_counts.py'
      - 'tests/test_legal_event_recall.py'
      - 'tests/test_procurement_fact_trace.py'
      - 'tests/test_legal_date_label_archive_recall.py'
      - 'tests/test_protocol_date_label_recall.py'
      - 'tests/test_clarification_date_label_recall.py'
      - 'tests/test_amendment_date_label_recall.py'
      - 'tests/test_date_label_pipeline_parity.py'
      - 'tests/test_docx_event_separators.py'
      - 'tests/test_local_numbered_event_recall.py'
      - 'tests/test_local_event_pipeline_parity.py'
      - 'tests/test_amendment_revised_deadline_evidence.py'
      - 'tests/test_sme_payment_clause_recall.py'
      - 'tests/test_legal_price_recall.py'
      - 'tests/test_audit_persistence_lock_scope.py'
      - 'tests/test_general_db_stage_retry.py'
      - 'tests/test_eis_mixed_soap_quarantine.py'
      - 'tests/test_eis_worker_backpressure.py'
      - 'tests/test_eis_original_upload_stream.py'
      - 'tests/test_official_publication_evidence.py'
      - 'tests/test_ingestion_*.py'
      - 'tests/test_v381*.py'
      - 'tests/test_organization_display.py'
      - 'tests/test_customer_metadata_lock_scope.py'
      - 'tests/test_memo_requisites.py'
      - 'tests/test_v382_finding_submissions.py'
      - 'tests/test_v383_msp_scope.py'
      - 'tests/test_v385_msp_reassessment.py'
      - 'tests/test_standalone_msp_imports.py'
      - 'tests/test_thematic_finding_submissions.py'
      - 'tests/test_thematic_memo_odt.py'
      - 'tests/test_thematic_persist_lock_scope.py'
      - 'tests/test_thematic_index_lock_scope.py'
      - 'tests/test_v343_card_presentation.py'
      - 'tests/test_account_frontend_requests.cjs'
      - 'tests/memo_fixture.py'
      - '.github/workflows/throughput-regressions.yml'
  push:
    branches: [thematic-audit-20261015]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1' 'openpyxl>=3.1,<4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded processing, evidence reuse and private memo fields
        env:
          PYTHONPATH: '.:scripts:tests'
        run: |
          python -m unittest discover -s tests -p 'test_extraction_throughput.py'
          python -m unittest discover -s tests -p 'test_general_original_collection_retry.py'
          python scripts/v372_automatic_legal_selftest.py
          python -m unittest discover -s tests -p 'test_legal_event_coverage.py'
          python -m unittest discover -s tests -p 'test_legal_security_clause_coverage.py'
          python -m unittest discover -s tests -p 'test_bid_security_price_basis.py'
          python -m unittest discover -s tests -p 'test_price_provenance_chain.py'
          python -m unittest discover -s tests -p 'test_receipt_original_parity.py'
          python -m unittest discover -s tests -p 'test_archive_member_occurrences.py'
          python -m unittest discover -s tests -p 'test_audit_funnel.py'
          python -m unittest discover -s tests -p 'test_audit_rule_counts.py'
          python -m unittest discover -s tests -p 'test_legal_event_recall.py'
          python -m unittest discover -s tests -p 'test_procurement_fact_trace.py'
          python -m unittest discover -s tests -p 'test_legal_date_label_archive_recall.py'
          python -m unittest test_protocol_date_label_recall test_clarification_date_label_recall test_amendment_date_label_recall test_date_label_pipeline_parity test_docx_event_separators
          python -m unittest test_local_numbered_event_recall test_local_event_pipeline_parity test_amendment_revised_deadline_evidence test_sme_payment_clause_recall
          python -m unittest discover -s tests -p 'test_legal_price_recall.py'
          python -m unittest discover -s tests -p 'test_audit_persistence_lock_scope.py'
          python -m unittest discover -s tests -p 'test_general_db_stage_retry.py'
          python -m unittest discover -s tests -p 'test_official_publication_evidence.py'
          python -m unittest discover -s tests -p 'test_ingestion_*.py'
          python -m unittest discover -s tests -p 'test_v381*.py'
          python -m unittest discover -s tests -p 'test_organization_display.py'
          python -m unittest discover -s tests -p 'test_customer_name_completion.py'
          python -m unittest discover -s tests -p 'test_customer_metadata_lock_scope.py'
          python -m unittest discover -s tests -p 'test_memo_requisites.py'
          python -m unittest discover -s tests -p 'test_eis*.py'
          python -m unittest discover -s tests -p 'test_v382_finding_submissions.py'
          python -m unittest discover -s tests -p 'test_v383_msp_scope.py'
          python -m unittest discover -s tests -p 'test_v385_msp_reassessment.py'
          python -m unittest discover -s tests -p 'test_standalone_msp_imports.py'
          python -m unittest discover -s tests -p 'test_thematic_finding_submissions.py'
          python -m unittest discover -s tests -p 'test_thematic_memo_odt.py'
          python -m unittest discover -s tests -p 'test_thematic_persist_lock_scope.py'
          python -m unittest discover -s tests -p 'test_thematic_index_lock_scope.py'
          python -m unittest discover -s tests -p 'test_v343_card_presentation.py'
          python -m unittest test_semantic_audit_sources test_legal_audit_revision test_automatic_review_scheduler test_automatic_recheck_fairness test_intake_automatic_rechecks test_automatic_card_handoff test_automatic_legal_status_ui test_automatic_legal_outcomes
          python -m unittest test_full_recheck_request test_full_recheck_runtime test_full_recheck_cohort_contract test_full_recheck_capacity test_stale_original_completion test_full_recheck_originals
          node tests/test_account_frontend_requests.cjs


name: Read-only EIS223 production smoke check
on:
  push:
    branches: [runtime-stability-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live read-only endpoints
        env:
          EIS223_SMOKE_URL: https://web-production-1c2ea.up.railway.app
        run: python scripts/live_smoke_check.py

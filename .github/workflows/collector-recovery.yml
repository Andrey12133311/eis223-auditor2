name: EIS collector recovery regressions
on:
  push:
    branches: [fix/loader-recovery-20261018, thematic-audit-20261015]
    paths:
      - 'scripts/v299_browser_collector.js'
      - 'scripts/v301_search_jobs.py'
      - 'scripts/v314_eis_metadata.py'
      - 'scripts/v332_all_procurements_audit.py'
      - 'tests/test_v377*'
      - 'scripts/v357_storage_guard.py'
      - 'tests/test_v376*'
      - 'tests/test_v357_storage_guard.py'
      - '.github/workflows/collector-recovery.yml'
  pull_request:
    paths:
      - 'scripts/v299_browser_collector.js'
      - 'scripts/v301_search_jobs.py'
      - 'scripts/v314_eis_metadata.py'
      - 'scripts/v332_all_procurements_audit.py'
      - 'tests/test_v377*'
      - 'scripts/v357_storage_guard.py'
      - 'tests/test_v376*'
      - 'tests/test_v357_storage_guard.py'
      - '.github/workflows/collector-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-docx>=1.1'
      - run: npm install --no-save --package-lock=false linkedom@0.18.12
      - run: python -m unittest discover -s tests -p 'test_v357_storage_guard.py' -v
      - run: python -m unittest discover -s tests -p 'test_v376_queue_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_v377_metadata*.py' -v
      - run: node --check scripts/v299_browser_collector.js
      - run: node tests/test_v376_collector_recovery.cjs
      - run: node tests/test_v314_collector.cjs
      - run: node tests/test_v341_collector.cjs
      - run: node tests/test_v377_collector_completion.cjs

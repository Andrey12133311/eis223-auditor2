name: V261 queue fairness and security
on:
  push:
    branches: [v261-prioritize-reachable-originals-20261010]
  pull_request:
    paths:
      - scripts/patch_v261.py
      - scripts/railway_start_v261.py
      - tests/test_v261.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source patch and boot script
        run: python -m py_compile scripts/patch_v261.py scripts/railway_start_v261.py
      - name: Verify ordering, backoff, allowed sources, no UI changes
        run: python -m unittest discover -s tests -p test_v261.py -v

name: Integrate reviewed recheck generation
on:
  push:
    branches: [fix/recheck-contention-and-legal-20261020]
    paths: [.github/workflows/integrate-recheck-generation.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Advance the combined interpretation without reusing generation nine
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('scripts/full_recheck_runtime.py')
          text = runtime.read_text()
          assert text.count('TARGET_GENERATION = 9\n') == 1
          runtime.write_text(text.replace('TARGET_GENERATION = 9\n','TARGET_GENERATION = 10\n'))
          tests = Path('tests/test_full_recheck_runtime.py')
          text = tests.read_text()
          old = '''    async def test_generation_nine_reads_documented_explanation_attachments(self):
                  self.assertEqual(runtime.TARGET_GENERATION, 9)
                  await self._assert_generation_transition(8, 9)
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.split('\n'))
          # Use explicit strings, not broad replacement of previous-generation tests.
          old = '    async def test_generation_nine_reads_documented_explanation_attachments(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 9)\n        await self._assert_generation_transition(8, 9)\n'
          new = '    async def test_generation_nine_reconciles_legal_fact_and_label_receipt_once(self):\n        with patch.object(runtime, "TARGET_GENERATION", 9):\n            await self._assert_generation_transition(8, 9)\n\n    async def test_generation_ten_reads_documented_explanation_attachments(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 10)\n        await self._assert_generation_transition(9, 10)\n'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '    async def test_generation_nine_preserves_old_pending_and_active_leases(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 9)\n        await self._assert_pending_and_active_generation_transition(8, 9)\n'
          new = '    async def test_generation_nine_preserves_existing_membership_receipts_and_active_lease(self):\n        with patch.object(runtime, "TARGET_GENERATION", 9):\n            await self._assert_pending_and_active_generation_transition(8, 9)\n\n    async def test_generation_ten_preserves_old_pending_and_active_leases(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 10)\n        await self._assert_pending_and_active_generation_transition(9, 10)\n'
          assert text.count(old) == 1
          tests.write_text(text.replace(old, new))
          PY
          git diff --check
      - run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
      - name: Test combined ownership, legal-fact, metadata and explanation changes
        env:
          PYTHONPATH: '.:scripts:tests'
        run: |
          python -m unittest test_recheck_contention_improvements test_explanation_supported_format test_explanation_quarantine_identity
          python -m unittest test_ingestion_metadata_contention test_legal_fact_write_contention test_parenthesized_event_date_labels test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry test_price_provenance_chain
          python -m pytest -q tests/test_v314_eis_metadata.py
          python -m unittest test_full_recheck_request test_full_recheck_runtime test_full_recheck_capacity test_full_recheck_cohort_contract test_full_recheck_originals
          python -m unittest test_eis223_soap_archive test_eis_mixed_soap_quarantine test_legal_audit_revision test_eis_server_worker test_audit_persistence_lock_scope test_thematic_persist_lock_scope
      - name: Publish only the two reconciled and tested code files
        run: |
          python - <<'PY'
          import subprocess
          expected={'scripts/full_recheck_runtime.py','tests/test_full_recheck_runtime.py'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == expected
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/full_recheck_runtime.py tests/test_full_recheck_runtime.py
          git commit -m 'Preserve PR100 generation-nine tests and advance combined explanation engine to ten'
          git push origin HEAD:refs/heads/fix/recheck-contention-and-legal-20261020
          git rev-parse HEAD

name: Live V257 read-only routes
on:
  pull_request:
    paths:
      - '.github/workflows/v257-live-routes.yml'
      - 'scripts/v257_readonly_smoke.py'
      - 'tests/test_account_live_smoke_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test probe contract with fake HTTP replies, no live traffic
        run: python -m unittest discover -s tests -p 'test_account_live_smoke_contract.py' -v
  smoke-live:
    # Production can still run the previous image. A live probe is an explicit
    # operational check, never proof that un-deployed PR code works.
    if: github.event_name == 'workflow_dispatch'
    needs: probe-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public health and protected anonymous routes without logging in
        run: python scripts/v257_readonly_smoke.py

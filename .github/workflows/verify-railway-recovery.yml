name: Verify Railway recovery backup
on:
  push:
    branches:
      - repair-railway-config-20261009
  workflow_dispatch:
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_railway_recovery.py' -v

name: Dashboard recovery regressions
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/dashboard-recovery.yml'
  push:
    branches: [fix/dashboard-load-20261020, thematic-audit-20261015]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/dashboard-recovery.yml'
permissions:
  contents: read
jobs:
  dashboard-and-evidence-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
          npm install --prefix /tmp/dashboard-jsdom --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Verify dashboard safety, browser behavior, evidence and frozen rechecks
        env:
          PYTHONPATH: '.:scripts:tests'
          NODE_PATH: /tmp/dashboard-jsdom/node_modules
          EIS_REQUIRE_BROWSER_TESTS: '1'
        run: |
          python -m unittest test_dashboard_read_recovery test_dashboard_load_ui test_dashboard_private_headers test_page_response_performance test_full_recheck_cohort_contract test_dashboard_filter_reset test_eis_vps_only_offline test_legal_audit_revision
          python -m unittest test_recheck_contention_improvements test_explanation_supported_format test_explanation_quarantine_identity test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry test_price_provenance_chain
          python -m unittest test_full_recheck_request test_full_recheck_runtime test_full_recheck_capacity test_full_recheck_originals
          python -m unittest test_eis223_soap_archive test_eis_mixed_soap_quarantine test_eis_server_worker test_audit_persistence_lock_scope test_thematic_persist_lock_scope

name: Recheck 4007 safety regressions
on:
  push:
    branches: [fix/recheck-4007-locks-20261020]
    paths: [.github/workflows/recheck-4007-regressions.yml]
permissions:
  contents: read
jobs:
  tested-base101-integration:
    if: github.ref == 'refs/heads/fix/recheck-4007-locks-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed integration of concurrent PR101
        run: |
          cat maintenance/recheck-base101.{0,1,2} > /tmp/integration.patch.gz
          echo 'c19e58f08f671b0916fcc35309130e368ba3693ef833edf58050f46c3ef9dfbb  /tmp/integration.patch.gz' | sha256sum -c -
          gzip -dc /tmp/integration.patch.gz > /tmp/integration.patch
          echo '205baa2b3a4b4cce97baa0817433b3dd749504e47cc84fd8ac365b2fa0ecb5a9  /tmp/integration.patch' | sha256sum -c -
          git apply --check /tmp/integration.patch
          git apply /tmp/integration.patch
          git diff --check
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
      - name: Verify fixed native SQLite
        run: |
          python scripts/build_sqlite_runtime.py /tmp/eis-sqlite
          echo 'LD_LIBRARY_PATH=/tmp/eis-sqlite' >> "$GITHUB_ENV"
      - name: Preserve both scopes, lease fencing and strict published explanation evidence
        env:
          PYTHONPATH: '.:scripts:tests'
        run: |
          python -c "import sqlite3; assert sqlite3.sqlite_version == '3.51.3'"
          python -m unittest test_fact_persistence_contention test_legal_fact_write_contention test_parenthesized_event_date_labels test_clarification_xml_evidence test_dashboard_4007_request test_explanation_quarantine_identity test_recheck_contention_improvements test_explanation_supported_format
          python -m unittest test_full_recheck_request test_full_recheck_runtime test_full_recheck_cohort_contract test_full_recheck_originals
          python -m unittest test_full_recheck_capacity
          python -m unittest test_legal_audit_revision test_official_publication_evidence test_legal_date_label_archive_recall test_legal_event_coverage test_legal_event_recall test_local_numbered_event_recall
          python -m unittest test_ingestion_metadata_contention test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry test_price_provenance_chain test_eis223_soap_archive test_eis_mixed_soap_quarantine test_eis_hard_failure_backoff test_automatic_review_scheduler
          python -m pytest -q tests/test_v314_eis_metadata.py
      - name: Commit only tested integration to isolated branch
        run: |
          python - <<'PY'
          import subprocess
          expected = {'scripts/official_publication_evidence.py','scripts/eis223_soap_xml.py','scripts/full_recheck_request.py','scripts/full_recheck_runtime.py','tests/test_full_recheck_runtime.py','tests/test_explanation_supported_format.py','tests/test_clarification_xml_evidence.py','tests/test_recheck_contention_improvements.py','.github/workflows/recheck-contention-investigation.yml'}
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed | {p for p in untracked if p.endswith(('.py','.yml'))} == expected, (changed,untracked)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve PR101 lease preflight and strict explanation parser; integrate verified dates as generation 11'
          git push origin HEAD:refs/heads/fix/recheck-4007-locks-20261020

name: Recheck 4007 safety regressions
on:
  push:
    branches: [fix/recheck-4007-locks-20261020]
    paths: [.github/workflows/recheck-4007-regressions.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export candidate metadata repair for isolated regression tests
        run: |
          mkdir -p /tmp/eis-source
          git archive --format=zip --output=/tmp/eis-source/source.zip HEAD
          git rev-parse HEAD > /tmp/eis-source/COMMIT
          sha256sum /tmp/eis-source/source.zip > /tmp/eis-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: recheck-4007-test-source
          path: /tmp/eis-source/
          retention-days: 1
          if-no-files-found: error

name: Recheck base101 source
on:
  push:
    branches: [fix/recheck-4007-locks-20261020]
    paths: [.github/workflows/recheck-base101-snapshot.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc95372b03e9b44cfeb1b8c88ec5f7f0f71152b7
          persist-credentials: false
      - run: |
          mkdir -p /tmp/eis-source
          git archive --format=zip --output=/tmp/eis-source/source.zip HEAD
          git rev-parse HEAD > /tmp/eis-source/COMMIT
          sha256sum /tmp/eis-source/source.zip > /tmp/eis-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: concurrent-base101-source
          path: /tmp/eis-source/
          retention-days: 1

name: V260 first-original recovery safety
on:
  push:
    branches: [v260-diagnostics-no-deploy-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile patch and private startup
        run: python -m py_compile scripts/patch_v260.py scripts/railway_start_v260.py
      - name: Test original recovery and unchanged counters
        run: python -m unittest discover -s tests -p 'test_v260.py' -v

name: Recheck latest source snapshot
on:
  push:
    branches: [fix/recheck-4007-locks-20261020]
    paths: [.github/workflows/recheck-source102.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 966f96c2a607c0ca315269e4492efc1c5eee243f
          persist-credentials: false
      - run: |
          mkdir -p /tmp/source
          git archive --format=zip --output=/tmp/source/source.zip HEAD
          git rev-parse HEAD > /tmp/source/COMMIT
          sha256sum /tmp/source/source.zip > /tmp/source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: recheck-base102-source
          path: /tmp/source/
          retention-days: 1

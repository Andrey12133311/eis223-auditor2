name: Recheck 4007 integration review
on:
  push:
    branches: [fix/recheck-4007-write-contention-20261020]
    paths: [.github/workflows/recheck-4007-integration.yml]
permissions:
  contents: read
concurrency:
  group: recheck4007-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/recheck-4007-write-contention-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge exact reviewed upstream and preserve concurrent fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          upstream='1e206d99b2577d7929ca6eb432ac648ebc6823d2'
          r=subprocess.run(['git','merge','--no-commit',upstream])
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert r.returncode in (0,1) and conflicts <= {'scripts/v314_eis_metadata.py','scripts/v341_eis_facts.py','tests/test_full_recheck_runtime.py'}, conflicts
          # Retain concurrent upstream metadata, fact-cache and legal changes.
          for name in ['scripts/v314_eis_metadata.py','scripts/v341_eis_facts.py','tests/test_full_recheck_runtime.py']:
              Path(name).write_bytes(subprocess.check_output(['git','show',upstream+':'+name]))
          p=Path('scripts/full_recheck_runtime.py');s=p.read_text();assert s.count('TARGET_GENERATION = 9')==1;p.write_text(s.replace('TARGET_GENERATION = 9','TARGET_GENERATION = 10'))
          p=Path('scripts/v341_eis_facts.py');s=p.read_text()
          before='                if row is None or dict(row) != snapshot:\n                    db.rollback()\n                    continue\n'
          after=('                if row is None or dict(row) != snapshot:\n'
                 '                    db.rollback()\n'
                 '                    # Rebase a derived-cache-only update, but never overwrite\n'
                 '                    # a newer intake source column with an older audit\'s facts.\n'
                 '                    # Final audit source/lease fences remain authoritative.\n'
                 '                    if row is not None and any(row[key] != value for key, value in snapshot.items()\n'
                 '                                               if key != "card_fields_json"):\n'
                 '                        print("FACT_CACHE_DEFERRED reason=concurrent_source_update", flush=True)\n'
                 '                        return\n'
                 '                    continue\n')
          assert s.count(before)==1;p.write_text(s.replace(before,after))
          p=Path('tests/test_full_recheck_runtime.py');s=p.read_text()
          before='    async def test_generation_nine_reconciles_legal_fact_and_label_receipt_once(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 9)\n        await self._assert_generation_transition(8, 9)\n'
          after=('    async def test_generation_nine_reconciles_legal_fact_and_label_receipt_once(self):\n'
                 '        with patch.object(runtime, "TARGET_GENERATION", 9):\n'
                 '            await self._assert_generation_transition(8, 9)\n\n'
                 '    async def test_generation_ten_reconciles_concurrent_source_write_guard_once(self):\n'
                 '        self.assertEqual(runtime.TARGET_GENERATION, 10)\n'
                 '        await self._assert_generation_transition(9, 10)\n')
          assert s.count(before)==1;s=s.replace(before,after)
          before='    async def test_generation_nine_preserves_existing_membership_receipts_and_active_lease(self):\n        self.assertEqual(runtime.TARGET_GENERATION, 9)\n        await self._assert_pending_and_active_generation_transition(8, 9)\n'
          after=('    async def test_generation_nine_preserves_existing_membership_receipts_and_active_lease(self):\n'
                 '        with patch.object(runtime, "TARGET_GENERATION", 9):\n'
                 '            await self._assert_pending_and_active_generation_transition(8, 9)\n\n'
                 '    async def test_generation_ten_preserves_generation_nine_history_and_live_lease(self):\n'
                 '        self.assertEqual(runtime.TARGET_GENERATION, 10)\n'
                 '        await self._assert_pending_and_active_generation_transition(9, 10)\n')
          assert s.count(before)==1;p.write_text(s.replace(before,after))
          p=Path('tests/test_recheck4007_safety.py');s=p.read_text().replace('_fact_plan','_fact_updates').replace('(3,4007,9)','(3,4007,10)').replace('synthetic-generation-nine','synthetic-generation-ten');p.write_text(s)
          p=Path('docs/recheck-4007-rollout.md');s=p.read_text().replace('advances from 8 to 9','advances from 9 to 10').replace('target generation 9','target generation 10');s+='\nConcurrent production changes through `1e206d99b2577d7929ca6eb432ac648ebc6823d2` are retained, including parenthesized event-date labels, price-recovery retries and ingestion metadata safety. Generation 9 remains a historical tested transition; this combined change uses generation 10.\n';p.write_text(s)
          expected={'scripts/full_recheck_runtime.py':'1b8f6af920ffb4da6da501a07bd11dd11243bf1d','scripts/v314_eis_metadata.py':'d82f67db7c9a596f9f32499de400bd3f1854310d','scripts/v341_eis_facts.py':'1b37bd30547936b9517548608f70fdc4d48017c9','tests/test_full_recheck_runtime.py':'b46d296ff5115a829e04b325568ab1feb2f25ead','tests/test_recheck4007_safety.py':'800efaf03da4bdcbc0ca022841623cf512e9035d'}
          for name,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip();assert actual==sha,(name,actual,sha)
          subprocess.run(['git','add','scripts/v314_eis_metadata.py','scripts/v341_eis_facts.py','scripts/full_recheck_runtime.py','tests/test_full_recheck_runtime.py','tests/test_recheck4007_safety.py','docs/recheck-4007-rollout.md'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
      - name: Compile native fixed SQLite
        run: |
          python scripts/build_sqlite_runtime.py /tmp/eis-sqlite
          echo 'LD_LIBRARY_PATH=/tmp/eis-sqlite' >> "$GITHUB_ENV"
      - name: Run combined regressions before isolated branch commit
        env:
          PYTHONPATH: '.:scripts:tests'
        run: |
          python -c "import sqlite3; assert sqlite3.sqlite_version == '3.51.3'"
          python -m unittest test_recheck4007_safety test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry test_full_recheck_request test_ingestion_metadata_contention test_legal_fact_write_contention test_parenthesized_event_date_labels
          python -m unittest test_full_recheck_runtime test_full_recheck_capacity test_full_recheck_cohort_contract
          python -m unittest test_price_provenance_chain test_procurement_fact_trace test_clarification_identity test_clarification_date_label_recall test_protocol_date_label_recall test_audit_persistence_lock_scope test_thematic_persist_lock_scope
          python -m pytest -q tests/test_v314_eis_metadata.py
      - name: Commit tested integration only to isolated branch
        run: |
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git diff --name-only)"
          git commit -m 'Integrate concurrent metadata and legal fixes; preserve generation history and full-dashboard request'
          git push origin HEAD:refs/heads/fix/recheck-4007-write-contention-20261020

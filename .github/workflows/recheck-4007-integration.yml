name: Recheck 4007 integration review
on:
  push:
    branches: [fix/recheck-4007-write-contention-20261020]
    paths: [.github/workflows/recheck-4007-integration.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export both reviewed revisions without modifying production
        run: |
          mkdir -p /tmp/recheck-integration
          git cat-file -e 1e206d99b2577d7929ca6eb432ac648ebc6823d2^{commit}
          git archive --format=zip --output=/tmp/recheck-integration/upstream.zip 1e206d99b2577d7929ca6eb432ac648ebc6823d2
          git archive --format=zip --output=/tmp/recheck-integration/ours.zip HEAD
          git rev-parse HEAD > /tmp/recheck-integration/HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recheck4007-integration-review
          path: /tmp/recheck-integration/
          retention-days: 1
          if-no-files-found: error

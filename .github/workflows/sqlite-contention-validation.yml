name: SQLite contention validation
on:
  push:
    branches: ['fix/sqlite-intake-contention-20261020']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only, without credentials or runtime data
        run: git archive --format=tar.gz --output=source.tar.gz HEAD app.py scripts tests requirements.txt requirements-accounts.txt Dockerfile
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-contention-source
          path: source.tar.gz
          retention-days: 1
          if-no-files-found: error

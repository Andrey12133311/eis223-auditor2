name: SQLite contention validation
on:
  push:
    branches: ['fix/sqlite-intake-contention-20261020']
permissions:
  contents: read
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-accounts.txt 'python-docx>=1.1,<2' 'openpyxl>=3.1,<4' pytest
      - name: Verify and apply exact locally tested source changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/sqlite-intake-contention-20261020'
          python .github/sqlite-contention-apply.py
          git diff --check
          python -m compileall -q scripts tests
      - name: Held-writer, fencing, event-loop and recovery regressions
        env:
          PYTHONPATH: '.:scripts:tests'
          PYTHONWARNINGS: 'ignore::ResourceWarning'
        run: |
          set -euo pipefail
          python -m unittest test_ingestion_metadata_contention test_eis_archive_responsiveness test_customer_name_completion test_customer_metadata_lock_scope test_general_db_stage_retry
          python -m unittest discover -s tests -p 'test_eis*.py'
          python -m unittest test_full_recheck_request test_full_recheck_runtime test_full_recheck_cohort_contract test_full_recheck_capacity test_stale_original_completion test_full_recheck_originals test_price_provenance_chain
      - name: Commit validated changes to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/sqlite-intake-contention-20261020'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Dockerfile scripts/v314_eis_metadata.py scripts/v298_eis_only.py scripts/full_recheck_runtime.py scripts/v294_eis_bridge.py
          git rm -- .github/metadata-contention.body .github/archive-contention.helpers .github/sqlite-contention-apply.py
          git commit -m 'Reduce no-op SQLite writers and keep archive intake off the HTTP event loop'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/fix/sqlite-intake-contention-20261020
      - name: Preserve source diff if validation fails
        if: failure()
        run: git diff --binary > validation-source.diff
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sqlite-contention-validation-diff
          path: validation-source.diff
          retention-days: 1
          if-no-files-found: ignore

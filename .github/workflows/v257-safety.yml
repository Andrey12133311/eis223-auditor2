name: V257 features and safety
on:
  push:
    branches: [v257-ui-manual-filters-ingestion-20261010]
  pull_request:
    paths:
      - 'scripts/v257_features.py'
      - 'scripts/patch_v257.py'
      - 'scripts/railway_start_v257.py'
      - 'tests/test_v257.py'
  workflow_dispatch:
jobs:
  test-v257:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check fastapi starlette httpx
      - name: Compile V257 code
        run: python -m py_compile scripts/v257_features.py scripts/patch_v257.py scripts/railway_start_v257.py
      - name: Test filters and independent manual list
        run: python -m unittest discover -s tests -p 'test_v257.py' -v
